name = "sharkflow-phone"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
# Keep variables added in the Cloudflare dashboard when GitHub deploys (otherwise plain-text vars get wiped).
keep_vars = true
# Easy-to-remember address. The workers.dev URL keeps working too (Twilio webhooks point there).
routes = [{ pattern = "crm.sharkflowlabs.com", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/twilio/*", "/public/*"]

[[d1_databases]]
binding = "DB"
database_name = "sharkflow-phone"
database_id = "a8b73e65-b207-4f14-8877-426f7fca70be"

# Workers AI powers the free lead assistant (screenshot -> prospect). No key needed.
[ai]
binding = "AI"

[vars]
# Not secret: your Twilio number (caller ID) and the TwiML App the dialer uses. Kept here so deploys never drop them.
TWILIO_NUMBER = "+14707061294"
TWILIO_TWIML_APP_SID = "AP5446ad391bc762c77db1811b7ed526ee"
# Optional. Your own cell in E.164 (e.g. +919876543210). Incoming calls ring the browser and this number together.
FORWARD_TO = ""
# Record every answered call (both sides). The other person hears RECORDING_NOTICE first.
RECORD_CALLS = "true"
RECORDING_NOTICE = "This call may be recorded."
# Websites allowed to post the public "text me my demo" form.
OPTIN_ORIGINS = "https://sharkflowlabs.pages.dev,https://sharkflowlabs.com,https://www.sharkflowlabs.com"
OPT_OUT_LINE = "Reply STOP to opt out."
# First text to each contact is preceded by this opt-in confirmation (required disclosures for verbal opt-ins).
OPT_IN_CONFIRM = "Sharkflow Labs: Thanks for agreeing to texts about your website demo. Msg frequency varies, msg & data rates may apply. Reply HELP for help, STOP to opt out."
VOICEMAIL_GREETING = "Hi, you've reached Sharkflow Labs. Sorry we missed you. Please leave your name, number and a short message after the tone."

# Secrets (set with `wrangler secret put NAME` or the GitHub Action):
# APP_PASSWORD, SESSION_SECRET, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_NUMBER,
# TWILIO_API_KEY_SID, TWILIO_API_KEY_SECRET, TWILIO_TWIML_APP_SID
# Optional: ANTHROPIC_API_KEY makes the lead assistant use Claude (paid per use); Workers AI is then the backup.
