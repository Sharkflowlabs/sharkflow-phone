name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check Cloudflare settings
        env:
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Strip spaces, line breaks and quotes that sneak in when pasting.
          ID=$(printf '%s' "$RAW_ACCOUNT_ID" | tr -d '[:space:]"'"'")
          if ! printf '%s' "$ID" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID should be 32 characters of 0-9 and a-f (Workers & Pages > Overview > Account ID). It is ${#ID} characters after removing spaces."
            exit 1
          fi
          echo "::add-mask::$ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$ID" >> "$GITHUB_ENV"
      - name: Update database tables
        run: npx wrangler d1 execute sharkflow-phone --remote --file=schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
